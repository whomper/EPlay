name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and gateway tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gateway dependencies
        run: if [ -f gateway/requirements.txt ]; then pip install -r gateway/requirements.txt; fi
      - name: Tools for the test files
        run: sudo apt-get update && sudo apt-get install -y sox lame
      - name: make test
        run: make test

  dsp:
    name: The DSP's programs on Hatari's DSP core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y sox lame a56
      - name: make dsptest
        run: make dsptest

  atari:
    name: Atari build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The m68k cross compiler, and a56 for the DSP's program
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu a56
      - name: Build the programs
        run: make
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      # no artifact: only formal releases leave the build machine

  hatari:
    name: Playing in Hatari (WAV, AIFF, MP3 on the DSP; the file selector held open)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu a56 hatari sox lame
      - name: Build
        run: make && make -C tests/hatari
      - name: The play rig (Falcon and Falcon-4, EmuTOS)
        run: python3 tests/hatari/play_test.py "$RUNNER_TEMP/play"
